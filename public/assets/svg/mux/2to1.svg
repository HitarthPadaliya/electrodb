<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="100%" height="100%">
  <title>2:1 MUX</title>
  <defs>
    <style>
      .wire { stroke: #00a7da; stroke-width: 2.5; fill: none; }
      .body { stroke: #168fe5; stroke-width: 2.5; fill: #0d1117; }
      .lbl { font-family: Consolas, Consolas; font-size: 11px; font-weight: bold; fill: #c5c7c9; }
      .title { font-family: Consolas, Consolas; font-size: 13px; font-weight: bold; fill: #e8eaed; text-anchor: middle; }
    </style>
  </defs>
  <!-- Trapezoid Body -->
  <polygon points="60,20 140,40 140,120 60,140" class="body" />
  <text x="100" y="85" class="title">2:1 MUX</text>

  <!-- Inputs -->
  
      <line x1="20" y1="45" x2="60" y2="45" class="wire" />
      <text x="65" y="49" class="lbl">D0</text>
    
      <line x1="20" y1="115" x2="60" y2="115" class="wire" />
      <text x="65" y="119" class="lbl">D1</text>
    

  <!-- Output -->
  <line x1="140" y1="80" x2="180" y2="80" class="wire" />
  <text x="145" y="84" class="lbl" style="text-anchor: end;">Y</text>

  <!-- Select lines (bottom) -->
  
      <line x1="85" y1="130" x2="85" y2="155" class="wire" />
      <text x="85" y="125" class="lbl" style="text-anchor: middle;">S</text>
    
</svg>
