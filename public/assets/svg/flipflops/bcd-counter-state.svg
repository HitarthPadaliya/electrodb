<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180" width="100%" height="100%">
  <title>Bcd Counter State State Diagram</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00a7da" />
    </marker>
    <style>
      .state { fill: #0d1117; stroke: #00a7da; stroke-width: 3; }
      .state-txt { font-family: Consolas, Consolas; font-size: 16px; font-weight: bold; fill: #c5c7c9; text-anchor: middle; dominant-baseline: middle; }
      .trans { stroke: #00a7da; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .trans-label { font-family: Consolas, Consolas; font-size: 12px; font-weight: 600; fill: #e8eaed; text-anchor: middle; background: white; }
    </style>
  </defs>

  <!-- State Q=0 -->
  <circle cx="80" cy="90" r="32" class="state" />
  <text x="80" y="90" class="state-txt">Q = 0</text>

  <!-- State Q=1 -->
  <circle cx="260" cy="90" r="32" class="state" />
  <text x="260" y="90" class="state-txt">Q = 1</text>

  <!-- Self-loops -->
  <!-- Loop on 0 -->
  <path d="M 60,65 C 30,10 130,10 100,65" class="trans" />
  <text x="80" y="24" class="trans-label">0</text>

  <!-- Loop on 1 -->
  <path d="M 240,65 C 210,10 310,10 280,65" class="trans" />
  <text x="260" y="24" class="trans-label">1</text>

  <!-- Transition 0 -> 1 -->
  <path d="M 112,80 C 150,55 190,55 228,80" class="trans" />
  <text x="170" y="62" class="trans-label">1</text>

  <!-- Transition 1 -> 0 -->
  <path d="M 228,100 C 190,125 150,125 112,100" class="trans" />
  <text x="170" y="138" class="trans-label">0</text>
</svg>
