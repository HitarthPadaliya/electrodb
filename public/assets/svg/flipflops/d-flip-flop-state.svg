<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">D flip-flop state-transition diagram</title><desc id="desc">D flip-flop next state is the sampled D value.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#398b6d"/></marker><style>text{font-family:Arial,sans-serif;fill:#263748}.edge{stroke:#398b6d;stroke-width:2;fill:none;marker-end:url(#arrow)}.state{fill:#eef8f2;stroke:#3c9573;stroke-width:2}.label{font-size:13px;fill:#526576}.node-label{font-size:17px;font-weight:700}</style></defs><path class="edge" d="M294 137 C370 66 530 66 606 137"/><path class="edge" d="M606 183 C530 254 370 254 294 183"/><path class="edge" d="M232 127 C154 70 154 250 232 193"/><path class="edge" d="M668 193 C746 250 746 70 668 127"/><circle class="state" cx="260" cy="160" r="38"/><circle class="state" cx="640" cy="160" r="38"/><text class="node-label" x="260" y="166" text-anchor="middle">Q = 0</text><text class="node-label" x="640" y="166" text-anchor="middle">Q = 1</text><text class="label" x="450" y="45" text-anchor="middle">D=1 · next Q=1</text><text class="label" x="450" y="292" text-anchor="middle">D=0 · next Q=0</text><text class="label" x="95" y="157" text-anchor="middle">D=0 · hold at Q=0</text><text class="label" x="805" y="157" text-anchor="middle">D=1 · hold at Q=1</text><text class="label" x="450" y="335" text-anchor="middle">The next state equals D at the active clock edge.</text></svg>