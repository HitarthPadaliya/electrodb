<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 264" role="img" aria-labelledby="title desc"><title id="title">D flip-flop timing diagram</title><desc id="desc">Illustrative clock and input/output timing for D flip-flop.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#263748}.label{font-size:14px;fill:#526576}.hint{font-size:12px;fill:#7b8994}</style></defs><text x="150" y="34" class="hint">D flip-flop · idealized transitions, not to scale</text><path d="M150.0 48 V223" stroke="#e4eae6"/><path d="M352.5 48 V223" stroke="#e4eae6"/><path d="M555.0 48 V223" stroke="#e4eae6"/><path d="M757.5 48 V223" stroke="#e4eae6"/><path d="M960.0 48 V223" stroke="#e4eae6"/><text x="26" y="83" class="label">CLK</text><path d="M150 176 H251.2 V156 H352.5 V176 H453.8 V156 H555.0 V176 H656.2 V156 H757.5 V176 H858.8 V156 H960.0 V176" fill="none" stroke="#398b6d" stroke-width="2"/><text x="26" y="62" class="label">D</text><path d="M150 68 H352.5 V48 H555.0 V48 H757.5 V68 H960" fill="none" stroke="#6685a0" stroke-width="2"/><text x="26" y="112" class="label">Q(next)</text><path d="M150 118 H251.2 H352.5 H453.8 V98 H555.0 H656.2 H757.5 H858.8 V118 H960.0" fill="none" stroke="#6685a0" stroke-width="2"/><text x="540" y="244" class="hint" text-anchor="middle">Q(next) changes at each active rising clock edge; device-specific delays are omitted.</text></svg>