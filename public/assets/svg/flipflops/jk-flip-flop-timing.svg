<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 314" role="img" aria-labelledby="title desc"><title id="title">JK flip-flop timing diagram</title><desc id="desc">Illustrative clock and input/output timing for JK flip-flop.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#263748}.label{font-size:14px;fill:#526576}.hint{font-size:12px;fill:#7b8994}</style></defs><text x="150" y="34" class="hint">JK flip-flop · idealized transitions, not to scale</text><path d="M150.0 48 V273" stroke="#e4eae6"/><path d="M312.0 48 V273" stroke="#e4eae6"/><path d="M474.0 48 V273" stroke="#e4eae6"/><path d="M636.0 48 V273" stroke="#e4eae6"/><path d="M798.0 48 V273" stroke="#e4eae6"/><path d="M960.0 48 V273" stroke="#e4eae6"/><text x="26" y="83" class="label">CLK</text><path d="M150 226 H231.0 V206 H312.0 V226 H393.0 V206 H474.0 V226 H555.0 V206 H636.0 V226 H717.0 V206 H798.0 V226 H879.0 V206 H960.0 V226" fill="none" stroke="#398b6d" stroke-width="2"/><text x="26" y="62" class="label">J</text><path d="M150 68 H312.0 V48 H474.0 V68 H636.0 V68 H798.0 V48 H960" fill="none" stroke="#6685a0" stroke-width="2"/><text x="26" y="112" class="label">K</text><path d="M150 118 H312.0 V118 H474.0 V118 H636.0 V98 H798.0 V98 H960" fill="none" stroke="#6685a0" stroke-width="2"/><text x="26" y="162" class="label">Q(next)</text><path d="M150 168 H231.0 H312.0 H393.0 V148 H474.0 H555.0 H636.0 H717.0 V168 H798.0 H879.0 V148 H960.0" fill="none" stroke="#6685a0" stroke-width="2"/><text x="540" y="294" class="hint" text-anchor="middle">Q(next) changes at each active rising clock edge; device-specific delays are omitted.</text></svg>