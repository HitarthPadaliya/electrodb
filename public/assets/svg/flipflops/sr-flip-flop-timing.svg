<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 314" role="img" aria-labelledby="title desc"><title id="title">SR flip-flop timing diagram</title><desc id="desc">Illustrative clock and input/output timing for SR flip-flop.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#263748}.label{font-size:14px;fill:#526576}.hint{font-size:12px;fill:#7b8994}</style></defs><text x="150" y="34" class="hint">SR flip-flop · idealized transitions, not to scale</text><path d="M150.0 48 V273" stroke="#e4eae6"/><path d="M352.5 48 V273" stroke="#e4eae6"/><path d="M555.0 48 V273" stroke="#e4eae6"/><path d="M757.5 48 V273" stroke="#e4eae6"/><path d="M960.0 48 V273" stroke="#e4eae6"/><text x="26" y="83" class="label">CLK</text><path d="M150 226 H251.2 V206 H352.5 V226 H453.8 V206 H555.0 V226 H656.2 V206 H757.5 V226 H858.8 V206 H960.0 V226" fill="none" stroke="#398b6d" stroke-width="2"/><text x="26" y="62" class="label">S</text><path d="M150 68 H352.5 V48 H555.0 V68 H757.5 V68 H960" fill="none" stroke="#6685a0" stroke-width="2"/><text x="26" y="112" class="label">R</text><path d="M150 118 H352.5 V118 H555.0 V118 H757.5 V98 H960" fill="none" stroke="#6685a0" stroke-width="2"/><text x="26" y="162" class="label">Q(next)</text><path d="M150 168 H251.2 H352.5 H453.8 V148 H555.0 H656.2 H757.5 H858.8 V168 H960.0" fill="none" stroke="#6685a0" stroke-width="2"/><text x="540" y="294" class="hint" text-anchor="middle">Q(next) changes at each active rising clock edge; device-specific delays are omitted.</text></svg>