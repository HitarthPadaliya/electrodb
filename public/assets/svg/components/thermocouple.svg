<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-label="Thermocouple symbol">
  <title>Thermocouple symbol</title>

  <g fill="none" stroke-width="2" stroke-linecap="round">
    <path d="M70 100 H100" stroke="#00a7da"/>
    <path d="M70 140 H100" stroke="#00a7da"/>
  </g>

<rect x="100" y="40" width="180" height="160"
     rx="12" ry="12"
     fill="#0d1117"
     stroke="#21262d"
     stroke-width="2"/>

<g fill="#c5c7c9" font-family="Consolas" font-size="18"
  font-weight="400" text-anchor="middle"> <text x="190" y="115.25">THERMO</text> <text x="190" y="136.85">COUPLE</text> </g>

<g fill="#e8eaed" font-family="Consolas" font-size="16"
  font-weight="400" text-anchor="end"> <text x="57" y="105.5">T+</text> <text x="57" y="145.5">T−</text> </g> </svg>
