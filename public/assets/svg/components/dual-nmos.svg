<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-label="Dual N-channel MOSFET symbol">
    <title>Dual N-channel MOSFET symbol</title>

    <g fill="none" stroke="#e8eaed" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M60 80 H150"/>
        <path d="M60 160 H150"/>
        <path d="M210 80 V35 H270"/>
        <path d="M210 80 V115 H270"/>
        <path d="M210 160 V115 H270"/>
        <path d="M210 160 V205 H270"/>
    </g>

    <g fill="none" stroke="#00a7da" stroke-width="2.4" stroke-linecap="round">
        <path d="M180 48 V112"/>
        <path d="M180 128 V192"/>
        <path d="M150 48 V112"/>
        <path d="M150 128 V192"/>
    </g>

    <g fill="#168fe5" font-family="Consolas, monospace" font-size="16" text-anchor="end">
        <text x="50" y="85.5">G1</text>
        <text x="50" y="165.5">G2</text>
    </g>

    <g fill="#00dfc1" font-family="Consolas, monospace" font-size="16">
        <text x="280" y="40.5">D1</text>
        <text x="280" y="120.5">D2</text>
        <text x="280" y="120.5">S1</text>
        <text x="280" y="210.5">S2</text>
    </g>
</svg>