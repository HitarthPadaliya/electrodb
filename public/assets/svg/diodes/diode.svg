<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 229 100" width="100%" height="100%">
  <title>Rectifier Diode</title>
  <defs>
    <style>
      .wire { stroke: #00a7da; stroke-width: 2.5; fill: none; }
      .body { stroke: #168fe5; stroke-width: 2.5; fill: #101f38; }
      .bar { stroke: #21262d; stroke-width: 3; stroke-linecap: round; }
      .lbl { font-family: Consolas, Consolas; font-size: 12px; font-weight: bold; fill: #c5c7c9; text-anchor: middle; }
    </style>
  </defs>
  <!-- Leads -->
  <line x1="20" y1="50" x2="80" y2="50" class="wire" />
  <line x1="120" y1="50" x2="180" y2="50" class="wire" />
  <!-- Anode Triangle -->
  <polygon points="80,30 80,70 120,50" class="body" />
  <!-- Cathode Bar -->
  <line x1="120" y1="30" x2="120" y2="70" class="bar" />
  
  <text x="50" y="42" class="lbl">A</text>
  <text x="150" y="42" class="lbl">K</text>
  <text x="100" y="90" class="lbl">Rectifier Diode</text>
</svg>
