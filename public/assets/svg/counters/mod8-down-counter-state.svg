<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="100%" height="100%">
  <title>Mod-8 Down Counter State Diagram</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00a7da" />
    </marker>
    <style>
      .state { fill: #0d1117; stroke: #00a7da; stroke-width: 2.5; }
      .state-txt { font-family: Consolas, Consolas; font-size: 12px; font-weight: bold; fill: #101f38; text-anchor: middle; dominant-baseline: middle; }
      .trans { stroke: #00a7da; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .center-lbl { font-family: Consolas, Consolas; font-size: 13px; font-weight: bold; fill: #c5c7c9; text-anchor: middle; }
    </style>
  </defs>

  <text x="180" y="145" class="center-lbl">Mod-8 (DOWN)</text>
  <text x="180" y="162" class="center-lbl" style="font-size: 11px; font-weight: normal; fill: #64748b;">3-Bit State Ring</text>

  <line x1="200.3" y1="68.4" x2="220.5" y2="76.8" class="trans" />
  <line x1="252.1" y1="106.7" x2="260.4" y2="126.9" class="trans" />
  <line x1="261.6" y1="170.3" x2="253.2" y2="190.5" class="trans" />
  <line x1="223.3" y1="222.1" x2="203.1" y2="230.4" class="trans" />
  <line x1="159.7" y1="231.6" x2="139.5" y2="223.2" class="trans" />
  <line x1="107.9" y1="193.3" x2="99.6" y2="173.1" class="trans" />
  <line x1="98.4" y1="129.7" x2="106.8" y2="109.5" class="trans" />
  <line x1="136.7" y1="77.9" x2="156.9" y2="69.6" class="trans" />

  
    <circle cx="180.0" cy="60.0" r="22" class="state" />
    <text x="180.0" y="60.0" class="state-txt">111</text>
  
  
    <circle cx="243.6" cy="86.4" r="22" class="state" />
    <text x="243.6" y="86.4" class="state-txt">110</text>
  
  
    <circle cx="270.0" cy="150.0" r="22" class="state" />
    <text x="270.0" y="150.0" class="state-txt">101</text>
  
  
    <circle cx="243.6" cy="213.6" r="22" class="state" />
    <text x="243.6" y="213.6" class="state-txt">100</text>
  
  
    <circle cx="180.0" cy="240.0" r="22" class="state" />
    <text x="180.0" y="240.0" class="state-txt">011</text>
  
  
    <circle cx="116.4" cy="213.6" r="22" class="state" />
    <text x="116.4" y="213.6" class="state-txt">010</text>
  
  
    <circle cx="90.0" cy="150.0" r="22" class="state" />
    <text x="90.0" y="150.0" class="state-txt">001</text>
  
  
    <circle cx="116.4" cy="86.4" r="22" class="state" />
    <text x="116.4" y="86.4" class="state-txt">000</text>
  
</svg>
