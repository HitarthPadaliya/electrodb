<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <title>Decade Counter (Mod-10) State Diagram</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00a7da" />
    </marker>
    <style>
      .state { fill: #0d1117; stroke: #00dfc1; stroke-width: 2.5; }
      .state-txt { font-family: Consolas, Consolas; font-size: 11px; font-weight: bold; fill: #9ff3e4; text-anchor: middle; dominant-baseline: middle; }
      .state-dec { font-family: Consolas, Consolas; font-size: 10px; fill: #8a8d93; text-anchor: middle; }
      .trans { stroke: #00a7da; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .center-lbl { font-family: Consolas, Consolas; font-size: 13px; font-weight: bold; fill: #c5c7c9; text-anchor: middle; }
    </style>
  </defs>

  <text x="200" y="155" class="center-lbl">Mod-10 Decade</text>
  <text x="200" y="172" class="center-lbl" style="font-size: 11px; font-weight: normal; fill: #64748b;">Sequence: 0 → 9 → 0</text>

  <!-- Directed transitions between consecutive states -->
  <line x1="220.9" y1="66.8" x2="236.0" y2="71.7" class="trans" />
  <line x1="271.7" y1="96.9" x2="281.0" y2="109.7" class="trans" />
  <line x1="295.1" y1="151.1" x2="295.1" y2="166.9" class="trans" />
  <line x1="282.2" y1="208.7" x2="272.9" y2="221.5" class="trans" />
  <line x1="237.9" y1="247.7" x2="222.8" y2="252.6" class="trans" />
  <line x1="179.1" y1="253.2" x2="164.0" y2="248.3" class="trans" />
  <line x1="128.3" y1="223.1" x2="119.0" y2="210.3" class="trans" />
  <line x1="104.9" y1="168.9" x2="104.9" y2="153.1" class="trans" />
  <line x1="117.8" y1="111.3" x2="127.1" y2="98.5" class="trans" />
  <line x1="162.1" y1="72.3" x2="177.2" y2="67.4" class="trans" />

  <!-- States -->
  
    <circle cx="200.0" cy="60.0" r="20" class="state" />
    <text x="200.0" y="56.0" class="state-txt">0000</text>
    <text x="200.0" y="69.0" class="state-dec">0</text>
  
  
    <circle cx="258.8" cy="79.1" r="20" class="state" />
    <text x="258.8" y="75.1" class="state-txt">0001</text>
    <text x="258.8" y="88.1" class="state-dec">1</text>
  
  
    <circle cx="295.1" cy="129.1" r="20" class="state" />
    <text x="295.1" y="125.1" class="state-txt">0010</text>
    <text x="295.1" y="138.1" class="state-dec">2</text>
  
  
    <circle cx="295.1" cy="190.9" r="20" class="state" />
    <text x="295.1" y="186.9" class="state-txt">0011</text>
    <text x="295.1" y="199.9" class="state-dec">3</text>
  
  
    <circle cx="258.8" cy="240.9" r="20" class="state" />
    <text x="258.8" y="236.9" class="state-txt">0100</text>
    <text x="258.8" y="249.9" class="state-dec">4</text>
  
  
    <circle cx="200.0" cy="260.0" r="20" class="state" />
    <text x="200.0" y="256.0" class="state-txt">0101</text>
    <text x="200.0" y="269.0" class="state-dec">5</text>
  
  
    <circle cx="141.2" cy="240.9" r="20" class="state" />
    <text x="141.2" y="236.9" class="state-txt">0110</text>
    <text x="141.2" y="249.9" class="state-dec">6</text>
  
  
    <circle cx="104.9" cy="190.9" r="20" class="state" />
    <text x="104.9" y="186.9" class="state-txt">0111</text>
    <text x="104.9" y="199.9" class="state-dec">7</text>
  
  
    <circle cx="104.9" cy="129.1" r="20" class="state" />
    <text x="104.9" y="125.1" class="state-txt">1000</text>
    <text x="104.9" y="138.1" class="state-dec">8</text>
  
  
    <circle cx="141.2" cy="79.1" r="20" class="state" />
    <text x="141.2" y="75.1" class="state-txt">1001</text>
    <text x="141.2" y="88.1" class="state-dec">9</text>
  
</svg>
