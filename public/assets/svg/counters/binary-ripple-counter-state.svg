<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title desc"><title id="title">3-bit binary ripple counter state diagram</title><desc id="desc">3-bit binary ripple counter illustrative sequence transitions through 000 to 111 and wraps to 000.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#398b6d"/></marker><style>text{font-family:Arial,sans-serif;fill:#263748}.edge{stroke:#398b6d;stroke-width:2;fill:none;marker-end:url(#arrow)}.state{fill:#eef8f2;stroke:#3c9573;stroke-width:2}.label{font-size:14px;fill:#526576}.node-label{font-size:17px;font-weight:700}.hint{font-size:12px;fill:#7b8994}</style></defs><path class="edge" d="M111 95 H146"/><path class="edge" d="M218 95 H253"/><path class="edge" d="M325 95 H360"/><path class="edge" d="M432 95 H468"/><path class="edge" d="M540 95 H575"/><path class="edge" d="M647 95 H682"/><path class="edge" d="M754 95 H789"/><path class="edge" d="M825 123 V285 H40 V95 H785"/><rect class="state" x="40" y="70" width="70" height="50" rx="15"/><text class="node-label" x="75" y="101" text-anchor="middle">000</text><rect class="state" x="147" y="70" width="70" height="50" rx="15"/><text class="node-label" x="182" y="101" text-anchor="middle">001</text><rect class="state" x="254" y="70" width="70" height="50" rx="15"/><text class="node-label" x="289" y="101" text-anchor="middle">010</text><rect class="state" x="361" y="70" width="70" height="50" rx="15"/><text class="node-label" x="396" y="101" text-anchor="middle">011</text><rect class="state" x="469" y="70" width="70" height="50" rx="15"/><text class="node-label" x="504" y="101" text-anchor="middle">100</text><rect class="state" x="576" y="70" width="70" height="50" rx="15"/><text class="node-label" x="611" y="101" text-anchor="middle">101</text><rect class="state" x="683" y="70" width="70" height="50" rx="15"/><text class="node-label" x="718" y="101" text-anchor="middle">110</text><rect class="state" x="790" y="70" width="70" height="50" rx="15"/><text class="node-label" x="825" y="101" text-anchor="middle">111</text><text class="hint" x="450" y="310" text-anchor="middle">Advance on each active clock edge · ideal state sequence</text></svg>