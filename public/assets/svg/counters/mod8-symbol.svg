<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 231 140" width="100%" height="100%">
  <title>Mod-8 Up</title>
  <defs>
    <style>
      .wire { stroke: #00a7da; stroke-width: 2.5; fill: none; }
      .body { stroke: #168fe5; stroke-width: 2.5; fill: #0d1117; }
      .lbl-title { font-family: Consolas, Consolas; font-size: 13px; font-weight: bold; fill: #e8eaed; text-anchor: middle; }
      .lbl-sub { font-family: Consolas, Consolas; font-size: 11px; fill: #8a8d93; text-anchor: middle; }
      .pin { stroke: #168fe5; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <!-- IC Box -->
  <rect x="50" y="25" width="120" height="90" rx="6" class="body" />
  <text x="110" y="65" class="lbl-title">Mod-8 Up</text>
  <text x="110" y="85" class="lbl-sub">Binary Counter</text>

  <!-- Pins -->
  <line x1="20" y1="50" x2="50" y2="50" class="pin" />
  <line x1="20" y1="75" x2="50" y2="75" class="pin" />
  <line x1="20" y1="100" x2="50" y2="100" class="pin" />

  <line x1="170" y1="50" x2="200" y2="50" class="pin" />
  <line x1="170" y1="75" x2="200" y2="75" class="pin" />
  <line x1="170" y1="100" x2="200" y2="100" class="pin" />
</svg>
