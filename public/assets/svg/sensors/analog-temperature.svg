<g fill="#e8eaed" font-family="Consolas" font-size="16"
  font-weight="400"> <text x="57" y="95.5" text-anchor="end">VCC</text> <text x="57" y="155.5" text-anchor="end">GND</text> <text x="325" y="125.5" text-anchor="start">VOUT</text> </g> </svg>
