<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-label="Analog Temperature Sensor symbol">
  <title>Analog Temperature Sensor symbol</title>

  <g fill="none" stroke-width="2" stroke-linecap="round">
    <path d="M70 90 H100" stroke="#00a7da"/>
    <path d="M70 150 H100" stroke="#00a7da"/>
    <path d="M280 120 H310" stroke="#00dfc1" stroke-width="2.5"/>
  </g>

<rect x="100" y="40" width="180" height="160"
     rx="12" ry="12"
     fill="#0d1117"
     stroke="#21262d"
     stroke-width="2"/>

<g fill="#c5c7c9" font-family="Consolas" font-size="18"
