<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 140" width="100%" height="100%">
  <title>Non-Inverting Op-Amp</title>
  <defs>
    <style>
      .wire { stroke: #00a7da; stroke-width: 2.5; fill: none; }
      .body { stroke: #168fe5; stroke-width: 2.5; fill: #0d1117; }
      .lbl { font-family: Consolas, Consolas; font-size: 13px; font-weight: bold; fill: #c5c7c9; }
      .sign { font-family: Consolas, Consolas; font-size: 16px; font-weight: bold; fill: #c5c7c9; }
    </style>
  </defs>
  <!-- Inputs -->
  <line x1="20" y1="45" x2="60" y2="45" class="wire" />
  <line x1="20" y1="95" x2="60" y2="95" class="wire" />
  <text x="10" y="50" class="lbl">V-</text>
  <text x="10" y="100" class="lbl">V+</text>

  <!-- Triangle Body -->
  <polygon points="60,20 160,70 60,120" class="body" />
  <text x="70" y="50" class="sign">-</text>
  <text x="70" y="100" class="sign">+</text>

  <!-- Output -->
  <line x1="160" y1="70" x2="200" y2="70" class="wire" />
  <text x="205" y="75" class="lbl">Vout</text>
  <text x="110" y="135" class="lbl" style="text-anchor: middle;">Non-Inverting Op-Amp</text>
</svg>
