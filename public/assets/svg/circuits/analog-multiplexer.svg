    <circle cx="650" cy="260" r="3"/>
    <circle cx="650" cy="340" r="3"/>
    <circle cx="650" cy="380" r="3"/>
    <circle cx="650" cy="420" r="3"/>
    <circle cx="650" cy="500" r="3"/>
    <circle cx="650" cy="580" r="3"/>
  </g>

  <text class="label" x="250" y="389">3:8</text>
  <text class="label" x="250" y="413">Decoder</text>

  <text x="52" y="348">S2</text>
  <text x="52" y="408">S1</text>
  <text x="52" y="468">S0</text>

  <g text-anchor="end">
    <text x="366" y="108">I0</text>
    <text x="366" y="188">I1</text>
    <text x="366" y="268">I2</text>
    <text x="366" y="348">I3</text>
    <text x="366" y="428">I4</text>
    <text x="366" y="508">I5</text>
    <text x="366" y="588">I6</text>
