      <circle class="contact" cx="500" cy="0" r="4"/>
      <path class="control" d="M300 38H470V-10"/>
    </g>
  </defs>

  <rect class="body" x="200" y="50" width="100" height="710" rx="2"/>

  <g class="wire">
    <path d="M100 340H200M100 400H200M100 460H200"/>
    <path d="M650 100V660M650 380H760"/>
  </g>

  <use href="#switch" transform="translate(0 100)"/>
  <use href="#switch" transform="translate(0 180)"/>
  <use href="#switch" transform="translate(0 260)"/>
  <use href="#switch" transform="translate(0 340)"/>
  <use href="#switch" transform="translate(0 420)"/>
  <use href="#switch" transform="translate(0 500)"/>
  <use href="#switch" transform="translate(0 580)"/>
  <use href="#switch" transform="translate(0 660)"/>

