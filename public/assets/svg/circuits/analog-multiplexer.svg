<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820">
  <style>
    .wire{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .control{fill:none;stroke:#c5c7c9;stroke-width:2;stroke-dasharray:5 5}
    .body{fill:#101f38;stroke:#168fe5;stroke-width:2}
    .contact{fill:#101f38;stroke:#168fe5;stroke-width:2}
    .dot{fill:#fff}
    text{font:24px Consolas,monospace;fill:#168fe5}
    .label{font:bold 16px Arial,sans-serif;fill:#e8eaed;text-anchor:middle}
  </style>

  <defs>
