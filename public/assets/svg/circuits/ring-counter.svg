<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390">
  <title>4-bit Ring Counter</title>
  <desc>Four D flip-flops share a rising-edge clock. Q3 feeds D0. Active-low INIT presets the first stage and clears the remaining stages. Reference: </desc> [ece.iastate](https://www.ece.iastate.edu/~alexs/classes/2025_Fall_2810/slides_PDF/31_Examples_with_Counters.pdf)
  <style>
    .body{fill:#101f38;stroke:#168fe5;stroke-width:2}
    .input{fill:none;stroke:#168fe5;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .output{fill:none;stroke:#00dfdf;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .wire{fill:none;stroke:#c5c7c9;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .signal{font-family:Consolas,monospace;font-size:24px}
    .pin{fill:#e8eaed;font-family:Arial,sans-serif;font-size:16px}
    .note{fill:#c5c7c9;font-family:Arial,sans-serif;font-size:10px}
  </style>

  <g class="signal" fill="#00dfdf" text-anchor="middle">
    <text x="260" y="40">Q0</text>
    <text x="460" y="40">Q1</text>
    <text x="660" y="40">Q2</text>
    <text x="860" y="40">Q3</text>
  </g>

  <g class="output">
    <path d="M230 120H260V55"/>
    <path d="M430 120H460V55"/>
    <path d="M630 120H660V55"/>
    <path d="M830 120H860V55"/>
  </g>
  <g class="wire">
    <path d="M260 120H330"/>
    <path d="M460 120H530"/>
    <path d="M660 120H730"/>
    <path d="M860 120H900V355H70V120H130"/>
  </g>

  <g class="input">
    <path d="M30 270H710"/>
    <path d="M110 270V160H130"/>
    <path d="M310 270V160H330"/>
    <path d="M510 270V160H530"/>
    <path d="M710 270V160H730"/>
    <path d="M30 315H780"/>
    <path d="M180 315V235"/>
    <path d="M380 315V235"/>
    <path d="M580 315V235"/>
    <path d="M780 315V235"/>
  </g>

  <g class="body">
    <rect x="130" y="90" width="100" height="135"/>
    <rect x="330" y="90" width="100" height="135"/>
    <rect x="530" y="90" width="100" height="135"/>
    <rect x="730" y="90" width="100" height="135"/>
    <circle cx="180" cy="230" r="5"/>
    <circle cx="380" cy="230" r="5"/>
    <circle cx="580" cy="230" r="5"/>
    <circle cx="780" cy="230" r="5"/>
  </g>

  <g class="wire">
    <path d="M130 152L141 160L130 168"/>
    <path d="M330 152L341 160L330 168"/>
    <path d="M530 152L541 160L530 168"/>
    <path d="M730 152L741 160L730 168"/>
  </g>

  <g class="pin">
    <text x="141" y="126">D</text>
    <text x="341" y="126">D</text>
    <text x="541" y="126">D</text>
    <text x="741" y="126">D</text>
    <text x="207" y="126">Q</text>
    <text x="407" y="126">Q</text>
    <text x="607" y="126">Q</text>
    <text x="807" y="126">Q</text>
  </g>
  <g class="note" text-anchor="middle">
    <text x="180" y="212">PRE</text>
    <text x="380" y="212">CLR</text>
    <text x="580" y="212">CLR</text>
    <text x="780" y="212">CLR</text>
  </g>

  <g fill="#00dfdf">
    <circle cx="260" cy="55" r="4"/>
    <circle cx="460" cy="55" r="4"/>
    <circle cx="660" cy="55" r="4"/>
    <circle cx="860" cy="55" r="4"/>
    <circle cx="260" cy="120" r="3.5"/>
    <circle cx="460" cy="120" r="3.5"/>
    <circle cx="660" cy="120" r="3.5"/>
    <circle cx="860" cy="120" r="3.5"/>
  </g>
  <g fill="#168fe5">
    <circle cx="30" cy="270" r="4"/>
    <circle cx="110" cy="270" r="3.5"/>
    <circle cx="310" cy="270" r="3.5"/>
    <circle cx="510" cy="270" r="3.5"/>
    <circle cx="30" cy="315" r="4"/>
    <circle cx="180" cy="315" r="3.5"/>
    <circle cx="380" cy="315" r="3.5"/>
    <circle cx="580" cy="315" r="3.5"/>
  </g>

  <g class="signal" fill="#168fe5">
    <text x="30" y="259">CLK</text>
    <text x="30" y="342">INIT_n</text>
  </g>
</svg>