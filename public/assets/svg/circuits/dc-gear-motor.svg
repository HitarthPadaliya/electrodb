<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240">
  <style>
    .wire{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
    .body{fill:#101f38;stroke:#168fe5;stroke-width:2}
    .shaft{fill:none;stroke:#c5c7c9;stroke-width:4;stroke-linecap:round}
    text{font:24px Consolas,monospace;fill:#168fe5}
    .symbol{font:32px Arial,sans-serif;fill:#e8eaed;text-anchor:middle}
    .label{font:bold 16px Arial,sans-serif;fill:#e8eaed;text-anchor:middle}
  </style>

  <circle class="body" cx="350" cy="120" r="80"/>
  <rect class="body" x="500" y="65" width="150" height="110" rx="2"/>

  <g class="wire">
    <path d="M120 80H270"/>
    <path d="M120 160H270"/>
  </g>

  <rect class="body" x="270" y="68" width="24" height="24"/>
  <rect class="body" x="270" y="148" width="24" height="24"/>

  <path class="shaft" d="M430 120H500M650 120H760"/>

  <text class="symbol" x="350" y="131">M</text>
  <text class="label" x="575" y="126">GEARBOX</text>

  <text x="84" y="88">+</text>
  <text x="84" y="168">−</text>
</svg>