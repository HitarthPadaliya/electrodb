<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 270">
  <title>Asynchronous MOD-8 Down Counter</title>
  <desc>Three positive-edge-triggered T flip-flops with T tied high. Q0 clocks the second stage and Q1 clocks the third stage. The Q2 Q1 Q0 outputs count downward modulo eight. Reference: </desc> [sites.ecse.rpi](https://sites.ecse.rpi.edu/courses/S26/ECSE-1010/labs/Lab%204B%20-%20Sequential%20Logic%20Circuits.pdf)
  <style>
    .body{fill:#101f38;stroke:#168fe5;stroke-width:2}
    .input{fill:none;stroke:#168fe5;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .output{fill:none;stroke:#00dfdf;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .wire{fill:none;stroke:#c5c7c9;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .signal{fill:#00dfdf;font-family:Consolas,monospace;font-size:24px}
    .pin{fill:#e8eaed;font-family:Arial,sans-serif;font-size:16px}
  </style>

  <g class="signal" text-anchor="middle">
    <text x="240" y="44">Q0</text>
    <text x="440" y="44">Q1</text>
    <text x="640" y="44">Q2</text>
  </g>

  <g class="input">
    <path d="M90 86V120H120"/>
    <path d="M290 86V120H320"/>
    <path d="M490 86V120H520"/>
    <path d="M35 170H120"/>
  </g>
  <g fill="#168fe5" font-family="Consolas,monospace" font-size="24">
    <text x="90" y="76" text-anchor="middle">1</text>
    <text x="290" y="76" text-anchor="middle">1</text>
    <text x="490" y="76" text-anchor="middle">1</text>
    <text x="30" y="205">CLK</text>
  </g>

  <g class="output">
    <path d="M220 130H240V60"/>
    <path d="M420 130H440V60"/>
    <path d="M620 130H640V60"/>
  </g>
  <g class="wire">
    <path d="M240 130H270V170H320"/>
    <path d="M440 130H470V170H520"/>
  </g>

  <g class="body">
    <rect x="120" y="100" width="100" height="110"/>
    <rect x="320" y="100" width="100" height="110"/>
    <rect x="520" y="100" width="100" height="110"/>
  </g>

  <g class="wire">
    <path d="M120 162L131 170L120 178"/>
    <path d="M320 162L331 170L320 178"/>
    <path d="M520 162L531 170L520 178"/>
  </g>

  <g class="pin">
    <text x="132" y="126">T</text>
    <text x="332" y="126">T</text>
    <text x="532" y="126">T</text>
    <text x="197" y="136">Q</text>
    <text x="397" y="136">Q</text>
    <text x="597" y="136">Q</text>
  </g>

  <g fill="#168fe5">
    <circle cx="35" cy="170" r="4"/>
    <circle cx="90" cy="86" r="3.5"/>
    <circle cx="290" cy="86" r="3.5"/>
    <circle cx="490" cy="86" r="3.5"/>
  </g>
  <g fill="#00dfdf">
    <circle cx="240" cy="60" r="4"/>
    <circle cx="440" cy="60" r="4"/>
    <circle cx="640" cy="60" r="4"/>
    <circle cx="240" cy="130" r="3.5"/>
    <circle cx="440" cy="130" r="3.5"/>
  </g>
</svg>