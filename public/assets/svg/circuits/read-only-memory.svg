<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 900">
  <style>
    .wire{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .body{fill:#101f38;stroke:#168fe5;stroke-width:2;stroke-linejoin:round}
    .dot{fill:#fff}
    text{font:24px Consolas,monospace;fill:#168fe5}
    .output{fill:#00dfdf}
    .label{font:bold 16px Arial,sans-serif;fill:#e8eaed;text-anchor:middle}
    .annotation{font:10px Arial,sans-serif;fill:#c5c7c9}
  </style>

  <defs>
    <g id="diode">
      <path class="wire" d="M-50-35V0H-30M-10 0H0"/>
      <path class="body" d="M-30-10V10L-10 0Z"/>
      <path class="wire" d="M-10-10V10"/>
      <circle class="dot" cx="-50" cy="-35" r="3"/>
      <circle class="dot" cx="0" cy="0" r="3"/>
    </g>
    <path id="pulldown" class="wire" d="M0 0V12L-8 20L8 36L-8 52L8 68L0 76V110"/>
  </defs>

  <text class="label" x="570" y="40">4 × 4 Diode ROM</text>

  <rect class="body" x="180" y="140" width="120" height="440" rx="2"/>

  <g class="wire">
    <path d="M80 280H180M80 400H180"/>
    <path d="M300 180H920M300 300H920M300 420H920M300 540H920"/>

    <path d="M480 100V670M600 100V670M720 100V670M840 100V670"/>
    <path d="M480 780H840M660 780V820"/>
    <path d="M636 820H684M644 830H676M652 840H668"/>
  </g>

  <use href="#diode" transform="translate(480 215)"/>
  <use href="#diode" transform="translate(720 215)"/>

  <use href="#diode" transform="translate(600 335)"/>
  <use href="#diode" transform="translate(720 335)"/>

  <use href="#diode" transform="translate(480 455)"/>
  <use href="#diode" transform="translate(600 455)"/>
  <use href="#diode" transform="translate(840 455)"/>

  <use href="#diode" transform="translate(720 575)"/>
  <use href="#diode" transform="translate(840 575)"/>

  <use href="#pulldown" transform="translate(480 670)"/>
  <use href="#pulldown" transform="translate(600 670)"/>
  <use href="#pulldown" transform="translate(720 670)"/>
  <use href="#pulldown" transform="translate(840 670)"/>

  <g class="dot">
    <circle cx="600" cy="780" r="3"/>
    <circle cx="660" cy="780" r="3"/>
    <circle cx="720" cy="780" r="3"/>
  </g>

  <text x="30" y="288">A1</text>
  <text x="30" y="408">A0</text>

  <text class="label" x="240" y="350">2:4</text>
  <text class="label" x="240" y="376">Decoder</text>

  <g class="output" text-anchor="middle">
    <text x="480" y="80">D3</text>
    <text x="600" y="80">D2</text>
    <text x="720" y="80">D1</text>
    <text x="840" y="80">D0</text>
  </g>

  <g class="annotation">
    <text x="312" y="170">WL0</text>
    <text x="312" y="290">WL1</text>
    <text x="312" y="410">WL2</text>
    <text x="312" y="530">WL3</text>
    <text x="498" y="714">R</text>
    <text x="618" y="714">R</text>
    <text x="738" y="714">R</text>
    <text x="858" y="714">R</text>
  </g>
</svg>