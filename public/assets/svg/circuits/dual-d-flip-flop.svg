<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="100%" height="100%" role="img" aria-label="Dual D Flip-Flop circuit diagram">
  <title>Dual D Flip-Flop — circuit diagram</title>
  <g>
