    <text x="425" y="185" fill="#8a8d93" font-family="Consolas, Consolas, monospace" font-size="10" font-weight="400" text-anchor="middle">latch</text>
    <path d="M70,170 L150,170" fill="none" stroke="#00a7da" stroke-width="2" stroke-linecap="round"/>
    <text x="52" y="176" fill="#e8eaed" font-family="Consolas, Consolas, monospace" font-size="12" font-weight="600" text-anchor="start">D</text>
