  <g class="pin">
    <text x="121" y="161">T</text>
    <text x="321" y="161">T</text>
    <text x="521" y="161">T</text>
    <text x="721" y="161">T</text>
    <text x="188" y="170">Q</text>
    <text x="388" y="170">Q</text>
    <text x="588" y="170">Q</text>
    <text x="788" y="170">Q</text>
