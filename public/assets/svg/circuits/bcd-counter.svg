    <circle cx="90" cy="120" r="3"/>
    <circle cx="290" cy="120" r="3"/>
    <circle cx="490" cy="120" r="3"/>
    <circle cx="690" cy="120" r="3"/>
  </g>
  <g fill="#00dfdf">
    <circle cx="235" cy="98" r="4"/>
    <circle cx="435" cy="98" r="4"/>
    <circle cx="635" cy="98" r="4"/>
    <circle cx="835" cy="98" r="4"/>
    <circle cx="435" cy="115" r="3.5"/>
    <circle cx="835" cy="140" r="3.5"/>
  </g>

  <text x="635" y="345" class="note">Q1</text>
  <text x="635" y="403" class="note">Q3</text>
</svg>