    <path d="M410 165H435V98"/>
    <path d="M610 165H635V98"/>
    <path d="M810 165H835V98"/>
    <path d="M435 115H880V352H550"/>
    <path d="M835 140H910V388H550"/>
  </g>

  <g class="body">
