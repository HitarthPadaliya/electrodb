<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510">
  <title>Asynchronous BCD decade counter</title>
  <style>
    .body{fill:#101f38;stroke:#168fe5;stroke-width:2}
    .input{fill:none;stroke:#168fe5;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .output{fill:none;stroke:#00dfdf;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .wire{fill:none;stroke:#c5c7c9;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .signal{font-family:Consolas,monospace;font-size:24px}
    .pin{fill:#e8eaed;font-family:Arial,sans-serif;font-size:16px}
    .note{fill:#c5c7c9;font-family:Arial,sans-serif;font-size:10px}
    .title{fill:#e8eaed;font-family:Arial,sans-serif;font-size:16px;font-weight:bold}
  </style>

  <g class="signal" fill="#00dfdf" text-anchor="middle">
    <text x="235" y="83">Q0</text>
    <text x="435" y="83">Q1</text>
    <text x="635" y="83">Q2</text>
    <text x="835" y="83">Q3</text>
  </g>
  <g class="note" text-anchor="middle">
    <text x="235" y="59">LSB</text>
    <text x="835" y="59">MSB</text>
  </g>

  <g class="input">
    <path d="M90 120V155H110"/>
    <path d="M290 120V155H310"/>
    <path d="M490 120V155H510"/>
    <path d="M690 120V155H710"/>
    <path d="M40 195H110"/>
  </g>
  <g class="signal" fill="#168fe5" text-anchor="middle">
    <text x="90" y="110">1</text>
    <text x="290" y="110">1</text>
    <text x="490" y="110">1</text>
    <text x="690" y="110">1</text>
  </g>
  <text x="30" y="230" class="signal" fill="#168fe5">CLK</text>

  <g class="wire">
    <path d="M210 225H260V195H310"/>
    <path d="M410 225H460V195H510"/>
    <path d="M610 225H660V195H710"/>
    <path d="M810 225H828"/>
  </g>

  <g class="output">
