<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240">
  <style>
    .wire{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
    .body{fill:#101f38;stroke:#168fe5;stroke-width:2}
    text{font:24px Consolas,monospace;fill:#168fe5}
    .symbol{font:32px Arial,sans-serif;fill:#e8eaed;text-anchor:middle}
    .pole{font:bold 16px Arial,sans-serif;fill:#e8eaed;text-anchor:middle}
  </style>

  <circle class="body" cx="400" cy="120" r="90"/>

  <path class="wire" d="M140 120H300M500 120H660"/>

  <rect class="body" x="300" y="108" width="24" height="24"/>
  <rect class="body" x="476" y="108" width="24" height="24"/>

  <rect class="body" x="370" y="46" width="60" height="28" rx="2"/>
  <rect class="body" x="370" y="166" width="60" height="28" rx="2"/>

  <text class="pole" x="400" y="66">N</text>
  <text class="pole" x="400" y="186">S</text>
  <text class="symbol" x="400" y="131">M</text>

  <text x="104" y="128">+</text>
  <text x="680" y="128">−</text>
</svg>