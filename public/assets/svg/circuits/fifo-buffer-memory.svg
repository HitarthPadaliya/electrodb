<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 940">
  <style>
    .wire{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .body{fill:#101f38;stroke:#168fe5;stroke-width:2}
    .dot{fill:#fff}
    text{font:24px Consolas,monospace;fill:#168fe5}
    .output{fill:#00dfdf}
    .label{font:bold 16px Arial,sans-serif;fill:#e8eaed;text-anchor:middle}
    .pin{font:10px Arial,sans-serif;fill:#c5c7c9}
  </style>

  <rect class="body" x="400" y="140" width="440" height="240" rx="2"/>
  <rect class="body" x="180" y="500" width="240" height="150" rx="2"/>
  <rect class="body" x="820" y="500" width="240" height="150" rx="2"/>
  <rect class="body" x="470" y="740" width="300" height="130" rx="2"/>

  <g class="wire">
    <path d="M180 210H400M840 210H1040"/>

    <path d="M300 500V320H400"/>
    <path d="M940 500V320H840"/>

    <path d="M180 440H350V280H400"/>
    <path d="M1060 440H890V280H840"/>

    <path d="M100 540H180M100 610H180"/>
    <path d="M1060 540H1140M1060 610H1140"/>

    <path d="M420 575H445V780H470"/>
    <path d="M820 575H795V830H770"/>

    <path d="M620 700V740"/>
    <path d="M770 780H1040"/>
    <path d="M620 870V900H1040"/>
  </g>

  <text class="label" x="620" y="242">Dual-Port RAM</text>
  <text class="label" x="620" y="270">FIFO Storage</text>

  <text class="label" x="300" y="548">Write Control</text>
  <text class="label" x="300" y="574">Write Pointer</text>
  <text class="pin" x="210" y="603">Advance: WR_EN &amp; !FULL</text>
  <text class="pin" x="210" y="623">Pointer includes wrap bit</text>

  <text class="label" x="940" y="548">Read Control</text>
  <text class="label" x="940" y="574">Read Pointer</text>
  <text class="pin" x="850" y="603">Advance: RD_EN &amp; !EMPTY</text>
  <text class="pin" x="850" y="623">Pointer includes wrap bit</text>

  <text class="label" x="620" y="790">Pointer Comparison</text>
  <text class="label" x="620" y="816">Full / Empty Logic</text>

  <g text-anchor="end">
    <text x="160" y="218">DIN</text>
    <text x="160" y="448">WEN</text>
    <text x="80" y="548">CLK</text>
    <text x="80" y="618">RST</text>
  </g>

  <text x="1080" y="448">REN</text>
  <text x="1154" y="548">CLK</text>
  <text x="1154" y="618">RST</text>
  <text x="598" y="688">RST</text>

  <g class="pin">
    <text x="412" y="202">WDATA</text>
    <text x="790" y="202">RDATA</text>
    <text x="412" y="284">WEN</text>
    <text x="802" y="284">REN</text>
    <text x="412" y="324">WADDR</text>
    <text x="786" y="324">RADDR</text>
    <text x="210" y="486">WADDR</text>
    <text x="954" y="486">RADDR</text>
    <text x="434" y="696">WPTR</text>
    <text x="806" y="696">RPTR</text>
  </g>

  <g class="output">
    <text x="1060" y="218">DOUT</text>
    <text x="1060" y="788">FULL</text>
    <text x="1060" y="908">EMPTY</text>
  </g>
</svg>