<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490">
  <title>4-bit Synchronous Up-Down Counter</title>
  <desc>Four common-clock T flip-flops. U=1 selects up counting; U=0 selects down counting. Matching Q labels denote connected nets. Reference: </desc> [allaboutcircuits](https://www.allaboutcircuits.com/textbook/digital/chpt-11/synchronous-counters/)
  <style>
    .body{fill:#101f38;stroke:#168fe5;stroke-width:2}
    .input{fill:none;stroke:#168fe5;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .output{fill:none;stroke:#00dfdf;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .wire{fill:none;stroke:#c5c7c9;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .signal{font-family:Consolas,monospace;font-size:24px}
    .pin{fill:#e8eaed;font-family:Arial,sans-serif;font-size:16px}
    .note{fill:#c5c7c9;font-family:Arial,sans-serif;font-size:10px}
  </style>

  <g class="signal" fill="#00dfdf" text-anchor="middle">
    <text x="240" y="40">Q0</text>
    <text x="400" y="40">Q1</text>
    <text x="560" y="40">Q2</text>
  </g>
  <g class="output">
    <path d="M240 52V85"/>
    <path d="M400 52V85"/>
    <path d="M560 52V85"/>
  </g>

  <path d="M700 52V85" class="input"/>
  <text x="700" y="40" text-anchor="middle" class="signal" fill="#168fe5">U</text>
  <text x="740" y="65" class="note">1: UP · 0: DOWN</text>

  <rect x="130" y="85" width="700" height="145" class="body"/>
  <g class="pin" text-anchor="middle">
    <text x="480" y="113">T0 = 1</text>
    <text x="480" y="143">T1 = U·Q0 + ¬U·¬Q0</text>
    <text x="480" y="173">T2 = U·Q1·Q0 + ¬U·¬Q1·¬Q0</text>
    <text x="480" y="203">T3 = U·Q2·Q1·Q0 + ¬U·¬Q2·¬Q1·¬Q0</text>
  </g>

  <g class="wire">
    <path d="M180 230V280"/>
    <path d="M380 230V280"/>
    <path d="M580 230V280"/>
    <path d="M780 230V280"/>
  </g>

  <g class="input">
    <path d="M40 415H710"/>
    <path d="M110 415V345H130"/>
    <path d="M310 415V345H330"/>
    <path d="M510 415V345H530"/>
    <path d="M710 415V345H730"/>
    <path d="M40 460H780"/>
    <path d="M180 460V390"/>
    <path d="M380 460V390"/>
    <path d="M580 460V390"/>
    <path d="M780 460V390"/>
  </g>

  <g class="body">
    <rect x="130" y="280" width="100" height="100"/>
    <rect x="330" y="280" width="100" height="100"/>
    <rect x="530" y="280" width="100" height="100"/>
    <rect x="730" y="280" width="100" height="100"/>
    <circle cx="180" cy="385" r="5"/>
    <circle cx="380" cy="385" r="5"/>
    <circle cx="580" cy="385" r="5"/>
    <circle cx="780" cy="385" r="5"/>
  </g>

  <g class="wire">
    <path d="M130 337L141 345L130 353"/>
    <path d="M330 337L341 345L330 353"/>
    <path d="M530 337L541 345L530 353"/>
    <path d="M730 337L741 345L730 353"/>
  </g>

  <g class="pin" text-anchor="middle">
    <text x="180" y="301">T</text>
    <text x="380" y="301">T</text>
    <text x="580" y="301">T</text>
    <text x="780" y="301">T</text>
    <text x="215" y="322">Q</text>
    <text x="415" y="322">Q</text>
    <text x="615" y="322">Q</text>
    <text x="815" y="322">Q</text>
  </g>
  <g class="note" text-anchor="middle">
    <text x="180" y="370">CLR</text>
    <text x="380" y="370">CLR</text>
    <text x="580" y="370">CLR</text>
    <text x="780" y="370">CLR</text>
  </g>

  <g class="output">
    <path d="M230 317H255"/>
    <path d="M430 317H455"/>
    <path d="M630 317H655"/>
    <path d="M830 317H855"/>
  </g>
  <g class="signal" fill="#00dfdf">
    <text x="265" y="325">Q0</text>
    <text x="465" y="325">Q1</text>
    <text x="665" y="325">Q2</text>
    <text x="865" y="325">Q3</text>
  </g>

  <g fill="#00dfdf">
    <circle cx="240" cy="52" r="3.5"/>
    <circle cx="400" cy="52" r="3.5"/>
    <circle cx="560" cy="52" r="3.5"/>
    <circle cx="255" cy="317" r="3.5"/>
    <circle cx="455" cy="317" r="3.5"/>
    <circle cx="655" cy="317" r="3.5"/>
    <circle cx="855" cy="317" r="3.5"/>
  </g>
  <g fill="#168fe5">
    <circle cx="700" cy="52" r="3.5"/>
    <circle cx="40" cy="415" r="4"/>
    <circle cx="110" cy="415" r="3.5"/>
    <circle cx="310" cy="415" r="3.5"/>
    <circle cx="510" cy="415" r="3.5"/>
    <circle cx="40" cy="460" r="4"/>
    <circle cx="180" cy="460" r="3.5"/>
    <circle cx="380" cy="460" r="3.5"/>
    <circle cx="580" cy="460" r="3.5"/>
  </g>
  <g class="signal" fill="#168fe5">
    <text x="40" y="406">CLK</text>
    <text x="40" y="487">RESET_n</text>
  </g>
</svg>