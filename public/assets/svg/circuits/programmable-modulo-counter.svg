<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420">
  <title>Programmable Modulo Counter</title>
  <desc>A synchronous programmable down counter reloads P when INIT or terminal count is asserted; otherwise it decrements. P equals N minus one. Terminal count is asserted when Q equals zero. INIT loads the starting value on a rising clock edge. Programmable counter principle: </desc> [frontgrade](https://www.frontgrade.com/sites/default/files/documents/datasheet-ut54acs193e_0.pdf)
  <style>
    .body{fill:#101f38;stroke:#168fe5;stroke-width:2}
    .input{fill:none;stroke:#168fe5;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .output{fill:none;stroke:#00dfdf;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .wire{fill:none;stroke:#c5c7c9;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .signal{font-family:Consolas,monospace;font-size:24px}
    .pin{fill:#e8eaed;font-family:Arial,sans-serif;font-size:16px}
    .note{fill:#c5c7c9;font-family:Arial,sans-serif;font-size:10px}
    .main{fill:#e8eaed;font-family:Arial,sans-serif;font-size:16px;font-weight:bold}
  </style>

  <g class="input">
    <path d="M70 120H240"/>
    <path d="M70 220H240"/>
    <path d="M70 275H240"/>
  </g>
  <g class="signal" fill="#168fe5">
    <text x="70" y="104">P = N−1</text>
    <text x="70" y="205">CLK</text>
    <text x="70" y="260">INIT</text>
  </g>

  <rect x="240" y="85" width="340" height="235" class="body"/>
  <text x="410" y="115" text-anchor="middle" class="main">n-bit Down Counter</text>

  <path d="M240 212L251 220L240 228" class="wire"/>
  <g class="pin">
    <text x="254" y="145">P[n−1:0]</text>
    <text x="254" y="280">INIT</text>
    <text x="565" y="180" text-anchor="end">Q</text>
    <text x="410" y="308" text-anchor="middle">TC</text>
  </g>

  <g class="note" text-anchor="middle">
    <text x="410" y="191">INIT ∨ TC : Q ← P</text>
    <text x="410" y="211">otherwise : Q ← Q − 1</text>
  </g>

  <path d="M580 175H640V65H850" class="output"/>
  <text x="850" y="51" text-anchor="end" class="signal" fill="#00dfdf">Q[n−1:0]</text>
  <path d="M640 175H690" class="wire"/>

  <rect x="690" y="140" width="120" height="70" class="body"/>
  <text x="750" y="181" text-anchor="middle" class="pin">Q = 0</text>

  <path d="M810 175H875" class="output"/>
  <text x="875" y="159" text-anchor="middle" class="signal" fill="#00dfdf">TC</text>
  <path d="M845 175V370H410V320" class="wire"/>

  <g fill="#168fe5">
    <circle cx="70" cy="120" r="4"/>
    <circle cx="70" cy="220" r="4"/>
    <circle cx="70" cy="275" r="4"/>
  </g>
  <g fill="#00dfdf">
    <circle cx="640" cy="175" r="3.5"/>
    <circle cx="850" cy="65" r="4"/>
    <circle cx="875" cy="175" r="4"/>
    <circle cx="845" cy="175" r="3.5"/>
  </g>
  <path d="M158 113L150 127" class="input"/>
  <path d="M780 58L772 72" class="output"/>
</svg>