<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500">
  <title>4-bit Johnson Counter</title>
  <style>
    .body{fill:#101f38;stroke:#168fe5;stroke-width:2}
    .input{fill:none;stroke:#168fe5;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .output{fill:none;stroke:#00dfdf;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .wire{fill:none;stroke:#c5c7c9;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .signal{font-family:Consolas,monospace;font-size:24px}
    .pin{fill:#e8eaed;font-family:Arial,sans-serif;font-size:16px}
    .note{fill:#c5c7c9;font-family:Arial,sans-serif;font-size:10px}
    .title{fill:#e8eaed;font-family:Arial,sans-serif;font-size:16px;font-weight:bold}
  </style>

  <g class="signal" fill="#00dfdf" text-anchor="middle">
    <text x="260" y="92">Q0</text>
    <text x="460" y="92">Q1</text>
    <text x="660" y="92">Q2</text>
    <text x="860" y="92">Q3</text>
  </g>

  <g class="output">
    <path d="M230 165H260V110"/>
    <path d="M430 165H460V110"/>
    <path d="M630 165H660V110"/>
    <path d="M830 165H860V110"/>
  </g>

  <g class="wire">
    <path d="M260 165H330"/>
    <path d="M460 165H530"/>
    <path d="M660 165H730"/>
    <path d="M830 225H890V400H70V165H130"/>
  </g>

  <g class="input">
    <path d="M35 340H710"/>
    <path d="M110 340V205H130"/>
    <path d="M310 340V205H330"/>
    <path d="M510 340V205H530"/>
    <path d="M710 340V205H730"/>
    <path d="M35 300H780"/>
    <path d="M180 300V280"/>
    <path d="M380 300V280"/>
    <path d="M580 300V280"/>
    <path d="M780 300V280"/>
  </g>

  <g class="body">
    <rect x="130" y="135" width="100" height="135"/>
    <rect x="330" y="135" width="100" height="135"/>
    <rect x="530" y="135" width="100" height="135"/>
    <rect x="730" y="135" width="100" height="135"/>
  </g>

  <g class="wire">
    <path d="M130 197L141 205L130 213"/>
    <path d="M330 197L341 205L330 213"/>
    <path d="M530 197L541 205L530 213"/>
    <path d="M730 197L741 205L730 213"/>
  </g>

  <g class="pin">
    <text x="141" y="171">D</text>
    <text x="341" y="171">D</text>
    <text x="541" y="171">D</text>
    <text x="741" y="171">D</text>

    <text x="207" y="170">Q</text>
    <text x="407" y="170">Q</text>
    <text x="607" y="170">Q</text>
    <text x="807" y="170">Q</text>
    <text x="807" y="230">Q</text>
  </g>
  <path d="M807 215H820" fill="none" stroke="#e8eaed" stroke-width="1.5"/>

  <g class="note">
    <text x="147" y="209">CLK</text>
    <text x="347" y="209">CLK</text>
    <text x="547" y="209">CLK</text>
    <text x="747" y="209">CLK</text>

    <text x="180" y="256" text-anchor="middle">CLR</text>
    <text x="380" y="256" text-anchor="middle">CLR</text>
    <text x="580" y="256" text-anchor="middle">CLR</text>
    <text x="780" y="256" text-anchor="middle">CLR</text>

    <text x="180" y="124" text-anchor="middle">D FF 0</text>
    <text x="380" y="124" text-anchor="middle">D FF 1</text>
    <text x="580" y="124" text-anchor="middle">D FF 2</text>
    <text x="780" y="124" text-anchor="middle">D FF 3</text>
  </g>

  <g class="body">
    <circle cx="180" cy="275" r="5"/>
    <circle cx="380" cy="275" r="5"/>
    <circle cx="580" cy="275" r="5"/>
    <circle cx="780" cy="275" r="5"/>
  </g>

  <g fill="#00dfdf">
    <circle cx="260" cy="110" r="4"/>
    <circle cx="460" cy="110" r="4"/>
    <circle cx="660" cy="110" r="4"/>
    <circle cx="860" cy="110" r="4"/>
    <circle cx="260" cy="165" r="3.5"/>
    <circle cx="460" cy="165" r="3.5"/>
    <circle cx="660" cy="165" r="3.5"/>
  </g>

  <g fill="#168fe5">
    <circle cx="35" cy="300" r="4"/>
    <circle cx="35" cy="340" r="4"/>
    <circle cx="180" cy="300" r="3.5"/>
    <circle cx="380" cy="300" r="3.5"/>
    <circle cx="580" cy="300" r="3.5"/>
    <circle cx="110" cy="340" r="3.5"/>
    <circle cx="310" cy="340" r="3.5"/>
    <circle cx="510" cy="340" r="3.5"/>
  </g>

  <g class="note" fill="#168fe5">
    <text x="35" y="287">RESET_n</text>
    <text x="35" y="363">CLK</text>
  </g>
</svg>