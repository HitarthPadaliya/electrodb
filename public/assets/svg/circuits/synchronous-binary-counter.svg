<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450">
  <title>4-bit Synchronous Binary Counter</title>
  <desc>Positive-edge-triggered T flip-flops with a common clock. T0=1, T1=Q0, T2=Q0 AND Q1, T3=Q0 AND Q1 AND Q2. Matching Q labels denote connected nets. Reference: </desc> [class.ece.iastate](http://class.ece.iastate.edu/arun/CprE281_F05/lectures/f05_week11.pdf)
  <style>
    .body{fill:#101f38;stroke:#168fe5;stroke-width:2}
    .input{fill:none;stroke:#168fe5;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .output{fill:none;stroke:#00dfdf;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .wire{fill:none;stroke:#c5c7c9;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .signal{fill:#00dfdf;font-family:Consolas,monospace;font-size:24px}
    .pin{fill:#e8eaed;font-family:Arial,sans-serif;font-size:16px}
    .note{fill:#c5c7c9;font-family:Arial,sans-serif;font-size:10px}
  </style>

  <g class="signal">
    <text x="370" y="146" text-anchor="middle">Q0</text>
    <text x="452" y="111">Q0</text>
    <text x="452" y="161">Q1</text>
    <text x="662" y="111">Q0</text>
    <text x="662" y="136">Q1</text>
    <text x="662" y="161">Q2</text>
  </g>
  <text x="170" y="146" text-anchor="middle" fill="#168fe5" font-family="Consolas,monospace" font-size="24">1</text>

  <g class="wire">
    <path d="M370 160V240"/>
    <path d="M492 105H520"/>
    <path d="M492 155H520"/>
    <path d="M702 105H730"/>
    <path d="M702 130H730"/>
    <path d="M702 155H730"/>
    <path d="M575 130H590V210H570V240"/>
    <path d="M785 130H800V210H770V240"/>
  </g>
  <path d="M170 160V240" class="input"/>

  <g class="body">
    <path d="M520 95H540A35 35 0 0 1 540 165H520Z"/>
    <path d="M730 95H750A35 35 0 0 1 750 165H730Z"/>
  </g>

  <g class="input">
    <path d="M35 375H700"/>
    <path d="M100 375V305H120"/>
    <path d="M300 375V305H320"/>
    <path d="M500 375V305H520"/>
    <path d="M700 375V305H720"/>
    <path d="M35 420H770"/>
    <path d="M170 420V350"/>
    <path d="M370 420V350"/>
    <path d="M570 420V350"/>
    <path d="M770 420V350"/>
  </g>

  <g class="body">
    <rect x="120" y="240" width="100" height="100"/>
    <rect x="320" y="240" width="100" height="100"/>
    <rect x="520" y="240" width="100" height="100"/>
    <rect x="720" y="240" width="100" height="100"/>
    <circle cx="170" cy="345" r="5"/>
    <circle cx="370" cy="345" r="5"/>
    <circle cx="570" cy="345" r="5"/>
    <circle cx="770" cy="345" r="5"/>
  </g>

  <g class="wire">
    <path d="M120 297L131 305L120 313"/>
    <path d="M320 297L331 305L320 313"/>
    <path d="M520 297L531 305L520 313"/>
    <path d="M720 297L731 305L720 313"/>
  </g>

  <g class="pin" text-anchor="middle">
    <text x="170" y="261">T</text>
    <text x="370" y="261">T</text>
    <text x="570" y="261">T</text>
    <text x="770" y="261">T</text>
    <text x="205" y="282">Q</text>
    <text x="405" y="282">Q</text>
    <text x="605" y="282">Q</text>
    <text x="805" y="282">Q</text>
  </g>
  <g class="note" text-anchor="middle">
    <text x="170" y="330">CLR</text>
    <text x="370" y="330">CLR</text>
    <text x="570" y="330">CLR</text>
    <text x="770" y="330">CLR</text>
  </g>

  <g class="output">
    <path d="M220 277H245"/>
    <path d="M420 277H445"/>
    <path d="M620 277H645"/>
    <path d="M820 277H845"/>
  </g>
  <g class="signal">
    <text x="255" y="285">Q0</text>
    <text x="455" y="285">Q1</text>
    <text x="655" y="285">Q2</text>
    <text x="855" y="285">Q3</text>
  </g>

  <g fill="#00dfdf">
    <circle cx="370" cy="160" r="3.5"/>
    <circle cx="245" cy="277" r="3.5"/>
    <circle cx="445" cy="277" r="3.5"/>
    <circle cx="645" cy="277" r="3.5"/>
    <circle cx="845" cy="277" r="3.5"/>
  </g>
  <g fill="#168fe5">
    <circle cx="170" cy="160" r="3.5"/>
    <circle cx="35" cy="375" r="4"/>
    <circle cx="100" cy="375" r="3.5"/>
    <circle cx="300" cy="375" r="3.5"/>
    <circle cx="500" cy="375" r="3.5"/>
    <circle cx="35" cy="420" r="4"/>
    <circle cx="170" cy="420" r="3.5"/>
    <circle cx="370" cy="420" r="3.5"/>
    <circle cx="570" cy="420" r="3.5"/>
  </g>

  <g fill="#168fe5" font-family="Consolas,monospace" font-size="24">
    <text x="35" y="366">CLK</text>
    <text x="35" y="447">RESET_n</text>
  </g>
</svg>