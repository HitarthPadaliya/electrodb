<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460">
  <title>MOD-10 Synchronous Counter</title>
  <style>
    .body{fill:#101f38;stroke:#168fe5;stroke-width:2}
    .input{fill:none;stroke:#168fe5;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .output{fill:none;stroke:#00dfdf;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .wire{fill:none;stroke:#c5c7c9;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .signal{font-family:Consolas,monospace;font-size:24px;fill:#00dfdf}
    .pin{fill:#e8eaed;font-family:Arial,sans-serif;font-size:16px}
    .note{fill:#c5c7c9;font-family:Arial,sans-serif;font-size:10px}
  </style>

  <g class="signal" text-anchor="middle">
    <text x="240" y="40">Q0</text>
    <text x="400" y="40">Q1</text>
    <text x="560" y="40">Q2</text>
    <text x="720" y="40">Q3</text>
  </g>
  <g class="output">
    <path d="M240 52V75"/>
    <path d="M400 52V75"/>
    <path d="M560 52V75"/>
    <path d="M720 52V75"/>
  </g>

  <rect x="130" y="75" width="700" height="120" class="body"/>
  <g class="pin" text-anchor="middle">
    <text x="480" y="101">D0 = ¬Q0</text>
    <text x="480" y="125">D1 = (Q1 ⊕ Q0) · ¬Q3</text>
    <text x="480" y="149">D2 = Q2 ⊕ (Q1 · Q0)</text>
    <text x="480" y="173">D3 = (Q3 · ¬Q0) + (Q2 · Q1 · Q0)</text>
  </g>

  <g class="wire">
    <path d="M180 195V240"/>
    <path d="M380 195V240"/>
    <path d="M580 195V240"/>
    <path d="M780 195V240"/>
  </g>

  <g class="input">
    <path d="M40 375H710"/>
    <path d="M110 375V305H130"/>
    <path d="M310 375V305H330"/>
    <path d="M510 375V305H530"/>
    <path d="M710 375V305H730"/>
    <path d="M40 420H780"/>
    <path d="M180 420V350"/>
    <path d="M380 420V350"/>
    <path d="M580 420V350"/>
    <path d="M780 420V350"/>
  </g>

  <g class="body">
    <rect x="130" y="240" width="100" height="100"/>
    <rect x="330" y="240" width="100" height="100"/>
    <rect x="530" y="240" width="100" height="100"/>
    <rect x="730" y="240" width="100" height="100"/>
    <circle cx="180" cy="345" r="5"/>
    <circle cx="380" cy="345" r="5"/>
    <circle cx="580" cy="345" r="5"/>
    <circle cx="780" cy="345" r="5"/>
  </g>

  <g class="wire">
    <path d="M130 297L141 305L130 313"/>
    <path d="M330 297L341 305L330 313"/>
    <path d="M530 297L541 305L530 313"/>
    <path d="M730 297L741 305L730 313"/>
  </g>

  <g class="pin" text-anchor="middle">
    <text x="180" y="261">D</text>
    <text x="380" y="261">D</text>
    <text x="580" y="261">D</text>
    <text x="780" y="261">D</text>
    <text x="215" y="282">Q</text>
    <text x="415" y="282">Q</text>
    <text x="615" y="282">Q</text>
    <text x="815" y="282">Q</text>
  </g>
  <g class="note" text-anchor="middle">
    <text x="180" y="330">CLR</text>
    <text x="380" y="330">CLR</text>
    <text x="580" y="330">CLR</text>
    <text x="780" y="330">CLR</text>
  </g>

  <g class="output">
    <path d="M230 277H255"/>
    <path d="M430 277H455"/>
    <path d="M630 277H655"/>
    <path d="M830 277H855"/>
  </g>
  <g class="signal">
    <text x="265" y="285">Q0</text>
    <text x="465" y="285">Q1</text>
    <text x="665" y="285">Q2</text>
    <text x="865" y="285">Q3</text>
  </g>

  <g fill="#00dfdf">
    <circle cx="240" cy="52" r="3.5"/>
    <circle cx="400" cy="52" r="3.5"/>
    <circle cx="560" cy="52" r="3.5"/>
    <circle cx="720" cy="52" r="3.5"/>
    <circle cx="255" cy="277" r="3.5"/>
    <circle cx="455" cy="277" r="3.5"/>
    <circle cx="655" cy="277" r="3.5"/>
    <circle cx="855" cy="277" r="3.5"/>
  </g>
  <g fill="#168fe5">
    <circle cx="40" cy="375" r="4"/>
    <circle cx="110" cy="375" r="3.5"/>
    <circle cx="310" cy="375" r="3.5"/>
    <circle cx="510" cy="375" r="3.5"/>
    <circle cx="40" cy="420" r="4"/>
    <circle cx="180" cy="420" r="3.5"/>
    <circle cx="380" cy="420" r="3.5"/>
    <circle cx="580" cy="420" r="3.5"/>
  </g>

  <g font-family="Consolas,monospace" font-size="24" fill="#168fe5">
    <text x="40" y="366">CLK</text>
    <text x="40" y="447">RESET_n</text>
  </g>
</svg>