<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240">
  <style>
    .wire{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
    .body{fill:#101f38;stroke:#168fe5;stroke-width:2}
    .shaft{fill:none;stroke:#00dfdf;stroke-width:4;stroke-linecap:round}
    text{font:24px Consolas,monospace;fill:#168fe5}
    .label{font:bold 16px Arial,sans-serif;fill:#e8eaed;text-anchor:middle}
  </style>

  <rect class="body" x="300" y="40" width="220" height="160" rx="2"/>

  <g class="wire">
    <path d="M160 70H300"/>
    <path d="M160 120H300"/>
    <path d="M160 170H300"/>
  </g>

  <path class="shaft" d="M520 120H650"/>

  <g text-anchor="end">
    <text x="140" y="78">VCC</text>
    <text x="140" y="128">PWM</text>
    <text x="140" y="178">GND</text>
  </g>

  <text class="label" x="410" y="126">SERVO</text>
</svg>