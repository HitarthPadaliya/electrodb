<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330">
  <title>4-bit Binary Up Counter</title>
  <style>
    .body{fill:#101f38;stroke:#168fe5;stroke-width:2}
    .input{fill:none;stroke:#168fe5;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .output{fill:none;stroke:#00dfdf;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .wire{fill:none;stroke:#c5c7c9;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .signal{font-family:Consolas,monospace;font-size:24px}
    .pin{fill:#e8eaed;font-family:Arial,sans-serif;font-size:16px}
    .note{fill:#c5c7c9;font-family:Arial,sans-serif;font-size:10px}
    .title{fill:#e8eaed;font-family:Arial,sans-serif;font-size:16px;font-weight:bold}
  </style>

  <g class="signal" fill="#00dfdf" text-anchor="middle">
    <text x="235" y="82">Q0</text>
    <text x="435" y="82">Q1</text>
    <text x="635" y="82">Q2</text>
    <text x="835" y="82">Q3</text>
  </g>
  <g class="note" text-anchor="middle">
    <text x="235" y="58">LSB</text>
    <text x="835" y="58">MSB</text>
  </g>

  <g class="input">
    <path d="M90 120V155H110"/>
    <path d="M290 120V155H310"/>
    <path d="M490 120V155H510"/>
    <path d="M690 120V155H710"/>
    <path d="M40 195H110"/>
  </g>
  <g class="signal" fill="#168fe5" text-anchor="middle">
    <text x="90" y="110">1</text>
    <text x="290" y="110">1</text>
    <text x="490" y="110">1</text>
    <text x="690" y="110">1</text>
  </g>
  <text x="30" y="230" class="signal" fill="#168fe5">CLK</text>

  <g class="wire">
    <path d="M210 225H260V195H310"/>
    <path d="M410 225H460V195H510"/>
    <path d="M610 225H660V195H710"/>
    <path d="M810 225H830"/>
  </g>
  <g class="output">
    <path d="M210 165H235V98"/>
    <path d="M410 165H435V98"/>
    <path d="M610 165H635V98"/>
    <path d="M810 165H835V98"/>
  </g>

  <g class="body">
    <rect x="110" y="135" width="100" height="110"/>
    <rect x="310" y="135" width="100" height="110"/>
    <rect x="510" y="135" width="100" height="110"/>
    <rect x="710" y="135" width="100" height="110"/>
  </g>
  <g class="wire">
    <path d="M110 187L121 195L110 203"/>
    <path d="M310 187L321 195L310 203"/>
    <path d="M510 187L521 195L510 203"/>
    <path d="M710 187L721 195L710 203"/>
  </g>

  <g class="pin">
    <text x="121" y="161">T</text>
    <text x="321" y="161">T</text>
    <text x="521" y="161">T</text>
    <text x="721" y="161">T</text>
    <text x="187" y="170">Q</text>
    <text x="387" y="170">Q</text>
    <text x="587" y="170">Q</text>
    <text x="787" y="170">Q</text>
    <text x="187" y="230">Q</text>
    <text x="387" y="230">Q</text>
    <text x="587" y="230">Q</text>
    <text x="787" y="230">Q</text>
  </g>
  <g fill="none" stroke="#e8eaed" stroke-width="1.5">
    <path d="M187 215H200"/>
    <path d="M387 215H400"/>
    <path d="M587 215H600"/>
    <path d="M787 215H800"/>
  </g>

  <g class="note">
    <text x="126" y="199">CLK</text>
    <text x="326" y="199">CLK</text>
    <text x="526" y="199">CLK</text>
    <text x="726" y="199">CLK</text>
    <text x="160" y="266" text-anchor="middle">T FF 0</text>
    <text x="360" y="266" text-anchor="middle">T FF 1</text>
    <text x="560" y="266" text-anchor="middle">T FF 2</text>
    <text x="760" y="266" text-anchor="middle">T FF 3</text>
  </g>

  <g fill="#168fe5">
    <circle cx="40" cy="195" r="4"/>
    <circle cx="90" cy="120" r="3"/>
    <circle cx="290" cy="120" r="3"/>
    <circle cx="490" cy="120" r="3"/>
    <circle cx="690" cy="120" r="3"/>
  </g>
  <g fill="#00dfdf">
    <circle cx="235" cy="98" r="4"/>
    <circle cx="435" cy="98" r="4"/>
    <circle cx="635" cy="98" r="4"/>
    <circle cx="835" cy="98" r="4"/>
  </g>
  <circle cx="830" cy="225" r="3" fill="#c5c7c9"/>
</svg>