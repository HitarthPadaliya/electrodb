<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620">
  <style>
    .wire{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .device{fill:none;stroke:#168fe5;stroke-width:2;stroke-linecap:round}
    .floating{fill:none;stroke:#00dfdf;stroke-width:2;stroke-linecap:round}
    .dot{fill:#fff}
    text{font:24px Consolas,monospace;fill:#168fe5}
    .label{font:bold 16px Arial,sans-serif;fill:#e8eaed;text-anchor:middle}
    .annotation{font:10px Arial,sans-serif;fill:#c5c7c9}
  </style>

  <text class="label" x="400" y="45">EEPROM Cell</text>

  <g class="wire">
    <path d="M140 100H680"/>
    <path d="M420 100V170H400"/>
    <path d="M140 200H375"/>
    <path d="M400 230H420V330H400"/>
    <path d="M140 370H360"/>
    <path d="M400 410H420V500"/>
    <path d="M140 500H680"/>
  </g>

  <g class="device">
    <path d="M375 170V230M400 170V230"/>
    <path d="M360 330V410M400 330V410"/>
  </g>

  <path class="floating" d="M380 330V410"/>

  <g class="dot">
    <circle cx="420" cy="100" r="3"/>
    <circle cx="420" cy="500" r="3"/>
  </g>

  <text x="88" y="108">BL</text>
  <text x="88" y="208">WL</text>
  <text x="88" y="378">CG</text>
  <text x="88" y="508">SL</text>

  <text class="annotation" x="448" y="204">Select transistor</text>
  <text class="annotation" x="448" y="374">Floating-gate transistor</text>
  <text class="annotation" x="370" y="316">FG</text>
</svg>