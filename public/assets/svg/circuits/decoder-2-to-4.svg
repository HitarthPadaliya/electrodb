<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 800">
  <style>
    .wire{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .gate{fill:#101f38;stroke:#168fe5;stroke-width:2;stroke-linejoin:round}
    .dot{fill:#fff}
    text{font:24px Consolas,monospace;fill:#168fe5}
    .output{fill:#00dfdf}
  </style>

  <defs>
    <g id="inverter">
      <path class="wire" d="M-20 0V-13H0M-20 0V13H0"/>
      <circle class="dot" cx="-20" cy="0" r="3"/>
      <path class="gate" d="M0-30H30A30 30 0 0 1 30 30H0Z"/>
      <circle class="gate" cx="66" cy="0" r="6"/>
    </g>
    <g id="branch">
      <path class="gate" d="M420-30H450A30 30 0 0 1 450 30H420Z"/>
      <circle class="gate" cx="486" cy="0" r="6"/>
      <path class="wire" d="M492 0H540"/>
      <use href="#inverter" transform="translate(560 0)"/>
      <path class="wire" d="M632 0H740"/>
    </g>
  </defs>

  <g class="wire">
    <path d="M60 100H80V718M172 100V718"/>
    <path d="M220 100H240V718M332 100V718"/>

    <path d="M172 247H420M332 273H420"/>
    <path d="M172 387H420M240 413H420"/>
    <path d="M80 527H420M332 553H420"/>
    <path d="M80 667H420M240 693H420"/>
  </g>

  <use href="#inverter" transform="translate(100 100)"/>
  <use href="#inverter" transform="translate(260 100)"/>

  <use href="#branch" transform="translate(0 260)"/>
  <use href="#branch" transform="translate(0 400)"/>
  <use href="#branch" transform="translate(0 540)"/>
  <use href="#branch" transform="translate(0 680)"/>

  <g class="dot">
    <circle cx="172" cy="247" r="3"/>
    <circle cx="332" cy="273" r="3"/>
    <circle cx="172" cy="387" r="3"/>
    <circle cx="240" cy="413" r="3"/>
    <circle cx="80" cy="527" r="3"/>
    <circle cx="332" cy="553" r="3"/>
    <circle cx="80" cy="667" r="3"/>
    <circle cx="240" cy="693" r="3"/>
  </g>

  <text x="24" y="78">A1</text>
  <text x="204" y="78">A0</text>

  <g text-anchor="middle">
    <text x="80" y="752">A1</text>
    <text x="172" y="752">A1'</text>
    <text x="240" y="752">A0</text>
    <text x="332" y="752">A0'</text>
  </g>

  <g class="output">
    <text x="758" y="268">Y0</text>
    <text x="758" y="408">Y1</text>
    <text x="758" y="548">Y2</text>
    <text x="758" y="688">Y3</text>
  </g>
</svg>