<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620">
  <style>
    .wire{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .coil{fill:none;stroke:#168fe5;stroke-width:2;stroke-linecap:round}
    .contact{fill:#101f38;stroke:#168fe5;stroke-width:2}
    .link{fill:none;stroke:#c5c7c9;stroke-width:2;stroke-dasharray:6 6}
    text{font:24px Consolas,monospace;fill:#168fe5}
    .output{fill:#00dfdf}
    .label{font:bold 16px Arial,sans-serif;fill:#e8eaed;text-anchor:middle}
  </style>

  <text class="label" x="460" y="45">DPDT Relay</text>

  <g class="wire">
    <path d="M200 120V220M200 380V500"/>

    <path d="M340 230H440L616 160"/>
    <path d="M624 160H740M624 260H740"/>

    <path d="M340 450H440L616 380"/>
    <path d="M624 380H740M624 480H740"/>
  </g>

  <path class="coil" d="M200 220Q260 240 200 260Q260 280 200 300Q260 320 200 340Q260 360 200 380"/>

  <path class="link" d="M240 300H500M500 206V426"/>

  <g class="contact">
    <circle cx="440" cy="230" r="4"/>
    <circle cx="620" cy="160" r="4"/>
    <circle cx="620" cy="260" r="4"/>
    <circle cx="440" cy="450" r="4"/>
    <circle cx="620" cy="380" r="4"/>
    <circle cx="620" cy="480" r="4"/>
  </g>

  <text x="184" y="100">A1</text>
  <text x="184" y="540">A2</text>

  <g text-anchor="end">
    <text x="320" y="238">COM1</text>
    <text x="320" y="458">COM2</text>
  </g>

  <g class="output">
    <text x="760" y="168">NC1</text>
    <text x="760" y="268">NO1</text>
    <text x="760" y="388">NC2</text>
    <text x="760" y="488">NO2</text>
  </g>
</svg>