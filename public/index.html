<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ElectroDB - a data-driven reference catalog for digital logic, semiconductor, analog, sensor, and electromechanical components.">
  <meta name="theme-color" content="#05070E">
  <title>ElectroDB - Electronic Components Reference Catalog</title>

  <!-- Favicon -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300..700&family=Poppins:wght@200;300;400;500;600;700&family=Lexend:wght@200..700&family=Inter:wght@300..700&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/assets/css/styles.css?v=12">

  <!-- KaTeX for LaTeX Math Rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- Cursor spotlight (decorative) -->
  <div class="cursor-glow" id="glow" aria-hidden="true"></div>

  <a class="skip-link" href="#app-content">Skip to content</a>

  <!-- Site Header / Navbar -->
  <header class="navbar" id="site-navbar">
    <a href="#/" class="brand" aria-label="ElectroDB home">
      <img src="/favicon.svg" alt="" width="40" height="40">
      <h1>Electro<span>DB</span></h1>
    </a>

    <nav class="links" id="nav-links" aria-label="Primary">
      <a href="#/" data-route="home">Home</a>
      <a href="#/catalog" data-route="catalog">Catalog</a>
      <a href="#/categories" data-route="categories">Categories</a>
      <a href="#/tags" data-route="tags">Tags</a>
      <a href="#/lab" data-route="lab" class="lab-mobile-link">Lab Console</a>
    </nav>

    <div class="header-actions">
      <div class="header-search">
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
          </svg>
        </span>
        <input
          type="search"
          id="global-search-input"
          class="search-input"
          placeholder="Search components…"
          aria-label="Search components"
          autocomplete="off"
        />
      </div>

      <a href="#/lab" class="lab-link" data-route="lab">
        <span aria-hidden="true">⚗</span> Lab Console
      </a>

      <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="nav-links">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- Main Content Container (populated by the SPA router) -->
  <main id="app-content" class="main-content" tabindex="-1"></main>

  <!-- Global Modal Box (SVG zoom, XML exports, forms) -->
  <div id="global-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-title">Details</h3>
        <button class="modal-close-btn" type="button" aria-label="Close dialog">&times;</button>
      </div>
      <div id="modal-body" class="modal-body">
        <!-- Content injected dynamically -->
      </div>
    </div>
  </div>

  <!-- Toast notifications -->
  <div id="toast-stack" class="toast-stack" role="status" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="/assets/js/api.js?v=12"></script>
  <script src="/assets/js/app.js?v=12"></script>
</body>
</html>
